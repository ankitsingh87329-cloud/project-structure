<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Student - Face Attendance System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<!-- Navbar -->
<nav class="navbar">

    <h2>📸 Face Attendance System</h2>

    <div>
        <a href="{{ url_for('index') }}">Dashboard</a>
        <a href="{{ url_for('students') }}">Students</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>

</nav>


<!-- Flash Messages -->
{% with messages = get_flashed_messages() %}

    {% if messages %}

        {% for message in messages %}

            <div class="alert">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}

{% endwith %}


<!-- Main -->
<div class="container">

    <div class="page-header">

        <div>
            <h1>Register Student</h1>

            <p>
                Add a new student and capture their face data.
            </p>
        </div>

    </div>


    <!-- Registration Form -->
    <div class="form-card">

        <form method="POST"
              action="{{ url_for('register') }}">

            <!-- Roll Number -->
            <div class="form-group">

                <label for="roll_no">
                    Roll Number
                </label>

                <input
                    type="text"
                    id="roll_no"
                    name="roll_no"
                    placeholder="Enter student roll number"
                    required
                >

            </div>


            <!-- Name -->
            <div class="form-group">

                <label for="name">
                    Student Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter student name"
                    required
                >

            </div>


            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter student email"
                    required
                >

            </div>


            <!-- Branch -->
            <div class="form-group">

                <label for="branch">
                    Branch
                </label>

                <input
                    type="text"
                    id="branch"
                    name="branch"
                    placeholder="Example: CSE(AI)"
                    required
                >

            </div>


            <!-- Buttons -->
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">

                <button
                    type="submit"
                    class="btn btn-success">
                    📷 Register & Capture Face
                </button>

                <a
                    href="{{ url_for('students') }}"
                    class="btn btn-secondary">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>

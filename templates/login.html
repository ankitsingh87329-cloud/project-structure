<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Face Attendance System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <h1>📸</h1>

        <h1>Face Attendance</h1>

        <p class="subtitle">
            Admin Login Panel
        </p>


        <!-- Flash Messages -->
        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="alert"
                         style="width: 100%; margin: 15px 0;">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- Login Form -->
        <form method="POST"
              action="{{ url_for('login') }}">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                    autocomplete="username"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                    autocomplete="current-password"
                >

            </div>


            <button
                type="submit"
                class="btn">
                🔐 Login
            </button>

        </form>


        <p style="
            text-align: center;
            margin-top: 25px;
            color: #6b7280;
            font-size: 13px;
        ">
            Face Recognition Attendance Management System
        </p>

    </div>

</div>

</body>
</html>
